[project]
name = "youtube-transcript-collector"
version = "1.3.0"
requires-python = ">=3.10"
dependencies = [
    "youtube-transcript-api>=1.2.4",
    "requests>=2.32",
]

[project.scripts]
youtube-transcript = "app.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
